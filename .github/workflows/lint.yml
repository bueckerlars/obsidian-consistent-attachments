name: Plugin quality

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]

jobs:
    check:
        name: Typecheck, lint, and build
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"
            - run: npm ci
            - run: npm run check
            - run: npm run build
